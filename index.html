<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambani Logistics - Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-950 text-white min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        function App() {
            const [view, setView] = useState('biometric');
            const [payStatus, setPayStatus] = useState('idle');

            // 1. BIOMETRIC LOGIN SCREEN
            if (view === 'biometric') return (
                <div className="max-w-md mx-auto h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div className="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mb-6 border-2 border-yellow-500">
                        <span className="text-5xl">🔐</span>
                    </div>
                    <h1 className="text-3xl font-bold mb-2">Bambani Logistics</h1>
                    <p className="text-slate-400 mb-8">Professional Roadside Assistance</p>
                    <button onClick={() => setView('hub')} className="w-full py-4 bg-yellow-500 text-black font-bold rounded-2xl shadow-lg shadow-yellow-500/20">SCAN FINGERPRINT</button>
                </div>
            );

            // 2. DISPATCH & PAYMENT HUB
            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-100 p-6 text-slate-900">
                    <h2 className="text-xl font-bold mb-6 text-blue-900">Dashboard</h2>
                    
                    {/* Roadside Dispatch Card */}
                    <div className="bg-white p-6 rounded-3xl shadow-md mb-6">
                        <h3 className="font-bold text-lg mb-1">Roadside Assistance</h3>
                        <p className="text-sm text-slate-500 mb-4">Status: Active Service Request</p>
                        <button className="w-full py-3 bg-blue-900 text-white rounded-xl font-bold">DISPATCH HELP</button>
                    </div>

                    {/* Payment Module */}
                    <div className="bg-white p-6 rounded-3xl shadow-md">
                        <h3 className="font-bold text-lg mb-4">Service Payment</h3>
                        <div className="text-center py-4 bg-slate-50 rounded-2xl mb-4 border-2 border-slate-200">
                            <p className="text-sm text-slate-500">Total Due</p>
                            <h1 className="text-4xl font-extrabold text-blue-900">R 850.00</h1>
                        </div>
                        {payStatus === 'idle' ? (
                            <button onClick={() => setPayStatus('paid')} className="w-full py-3 bg-green-600 text-white rounded-xl font-bold">PAY WITH CARD</button>
                        ) : (
                            <div className="space-y-3">
                                <p className="text-green-700 font-bold text-center">Payment Successful!</p>
                                <button onClick={() => window.print()} className="w-full py-3 bg-blue-900 text-white rounded-xl font-bold">PRINT WAYBILL RECEIPT</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
