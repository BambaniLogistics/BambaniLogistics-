<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambani Logistics</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        function App() {
            const [view, setView] = useState('biometric');
            const [payStatus, setPayStatus] = useState('idle');

            // 1. BIOMETRIC LOGIN SCREEN
            if (view === 'biometric') return (
                <div className="max-w-md mx-auto h-screen bg-blue-900 flex flex-col items-center justify-center p-6 text-white text-center">
                    <div className="w-24 h-24 bg-white rounded-full flex items-center justify-center mb-6 shadow-xl">
                        <span className="text-5xl">👆</span>
                    </div>
                    <h1 className="text-3xl font-bold mb-2">Bambani Logistics</h1>
                    <p className="text-slate-300 mb-8">Secure Biometric Access</p>
                    <button onClick={() => setView('hub')} className="w-full py-4 bg-amber-500 text-black font-bold rounded-2xl">SCAN FINGERPRINT</button>
                </div>
            );

            // 2. MAIN HUB (Dispatch + Billing)
            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 p-6">
                    <h2 className="text-2xl font-bold text-blue-900 mb-6">Dispatch Hub</h2>
                    
                    <div className="bg-white p-6 rounded-3xl shadow-sm mb-6 border border-slate-100">
                        <h3 className="font-bold text-lg mb-2">Hot Shot Dispatch</h3>
                        <p className="text-sm text-slate-500 mb-4">Status: Ready for Pickup</p>
                        <button className="w-full py-3 bg-blue-900 text-white rounded-xl font-bold">START JOB</button>
                    </div>

                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                        <h3 className="font-bold text-lg mb-4">Monthly Subscription</h3>
                        <h1 className="text-4xl font-extrabold text-blue-900 mb-4">R 1,500</h1>
                        {payStatus === 'idle' ? (
                            <button onClick={() => setPayStatus('paid')} className="w-full py-3 bg-amber-500 text-black font-bold rounded-xl">PAY NOW</button>
                        ) : (
                            <div className="space-y-3">
                                <p className="text-green-700 font-bold text-center">Payment Confirmed!</p>
                                <button onClick={() => window.print()} className="w-full py-3 bg-green-700 text-white rounded-xl font-bold">PRINT RECEIPT</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
